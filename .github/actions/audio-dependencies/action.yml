name: Pinned CyAudioCore and numerical dependency
description: Read-only source checkouts; no credentials in packaged artifacts.
inputs:
  token:
    description: Read token for private dependencies (or the job token for public repositories)
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: MrMybal/CyAudioCore
        ref: bb26e93604d43de2069694b0791bc0bcf5a53ea6
        path: .dependencies/CyAudioCore
        token: ${{ inputs.token }}
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: MrMybal/CyDSP
        ref: fda6bd30c5b622795cc08e8bd2750188a6c5a0c0
        path: .dependencies/CyDSP
        token: ${{ inputs.token }}
        persist-credentials: false
    - name: Export explicit dependency paths
      shell: bash
      run: |
        echo "CYDAW_CYAUDIOCORE_SOURCE_DIR=${GITHUB_WORKSPACE}/.dependencies/CyAudioCore" >> "$GITHUB_ENV"
        echo "CYDAW_CYDSP_SOURCE_DIR=${GITHUB_WORKSPACE}/.dependencies/CyDSP" >> "$GITHUB_ENV"
